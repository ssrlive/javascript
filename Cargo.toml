[package]
name = "javascript"
version = "0.3.4"
edition = "2024"
authors = ["ssrlive"]
license = "MIT"
description = "A JavaScript engine implementation in Rust"
repository = "https://github.com/ssrlive/javascript"
homepage = "https://crates.io/crates/javascript"
documentation = "https://docs.rs/javascript"
readme = "README.md"
keywords = ["javascript", "js", "engine", "interpreter", "runtime"]
categories = ["development-tools", "parsing"]

[features]
default = ["node", "console"]
node = ["process", "os", "fs"]
process = []
os = ["dep:libc", "dep:windows-sys"]
fs = []
console = []

[dependencies]
base64easy = "0.1.7"
bitflags = { version = "2.13.2", default-features = false, features = [] }
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5.17"
gc-arena = { version = "0.7.0", features = ["indexmap"] }
indexmap = "2.14.2"
log = "0.4.34"
num-bigint = "0.5.1"
num-traits = "0.2.19"
regress = { version = "0.12.0", features = ["utf16"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
temporal_rs = "0.2.6"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2.191", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_SystemInformation",
], optional = true }

[dev-dependencies]
clap = { version = "4.6.7", features = ["derive", "cargo", "wrap_help"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
ctor = "1.0.13"
dirs = "7.0.0"
env_logger = { version = "0.11.11" }
rustyline = "19.0.0"

[[example]]
name = "js-rs"
path = "js/main.rs"
required-features = ["node"]

[[bench]]
name = "promise_benchmarks"
path = "benches/promise_benchmarks.rs"
harness = false

[[bench]]
name = "bigint_bench"
path = "benches/bigint_bench.rs"
harness = false
